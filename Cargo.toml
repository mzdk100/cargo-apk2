[workspace.package]
version = "1.5.0"
authors = [
    "SmileSky <mzdk100@foxmail.com>",
    "The Rust Windowing contributors",
]
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["android", "ndk", "apk"]
repository = "https://github.com/mzdk100/cargo-apk2.git"
rust-version = "1.95.0"

[workspace.dependencies]
android-build = { version = "0.1.4", default-features = false }
android_logger = "0.15.1"
anyhow = "1.0.104"
cargo-subcommand = "0.12.0"
clap = "4.6.7"
dirs = "7.0.0"
dunce = "1.0.5"
eframe = "0.37.0"
env_logger = "0.11.11"
jni = "0.22.4"
libc = "1.0.0-alpha.5"
log = "0.4.34"
ndk = "0.9.0"
ndk-context = "0.1.1"
quick-xml = "0.42.0"
serde = "1.0.229"
slint = "1.18.1"
thiserror = "2.0.21"
toml = "1.1.8"
which = "8.0.6"
winit = "0.31.0-beta.3"

[workspace]
members = [
    "egui-examples",
    "groovy-examples",
    "java-examples",
    "kotlin-examples",
    "scala-examples",
    "slint-examples",
    "ndk-build2",
    "ndk-examples",
    "cargo-apk2",
]
resolver = "3"
